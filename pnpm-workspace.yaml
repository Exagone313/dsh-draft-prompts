# Build scripts pnpm may run. pnpm >= 11 denies every dependency's build scripts
# by default and fails the install when one is denied, so the two packages that
# need theirs (dprint's and esbuild's binary checks) are approved here.
allowBuilds:
  dprint: true
  esbuild: true

# pnpm >= 11 also gates every dependency behind a 1-day minimumReleaseAge. Both
# scopes below ship as a set (a dsh bump moves every @deepseek-ai package at
# once), so exempt them; every other package keeps the gate.
minimumReleaseAgeExclude:
  - "@exagone313/*"
  - "@deepseek-ai/*"

overrides:
  zod: ^4.6.6
